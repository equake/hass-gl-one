[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "ASYNC", "RUF", "B", "BLE"]
ignore = ["E501", "ASYNC109"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Put the repo root on sys.path so tests can `import custom_components.gl_one`
# regardless of how pytest is invoked (script vs `python -m`).
pythonpath = ["."]
